<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5f9e48">
  <meta name="description" content="Русскоязычная энциклопедия Stardew Valley для Android и iOS">
  <title>Stardew Encyclopedia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235f9e48'/%3E%3Cpath d='M8 2v12M2 8h12' stroke='%23f2b632' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <header class="bar">
    <a class="logo" href="#/" aria-label="Stardew Encyclopedia — на главную">
      <span class="logo-mark" aria-hidden="true">✦</span>
      <span>Stardew Encyclopedia</span>
    </a>
    <button id="theme" class="btn theme-btn" type="button" aria-label="Переключить тему" title="Переключить тему">◐</button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="loading" role="status">Загрузка энциклопедии…</div>
  </main>

  <nav class="tabs" aria-label="Основная навигация">
    <a href="#/" data-t="home">⌂<span>Главная</span></a>
    <a href="#/search" data-t="search">⌕<span>Поиск</span></a>
    <a href="#/c" data-t="c">▦<span>Разделы</span></a>
    <a href="#/fav" data-t="fav">☆<span>Избранное</span></a>
  </nav>

  <script src="js/app.js" defer></script>
</body>
</html>
